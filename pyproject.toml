[project]
name = "google-ads-mcp-server"
version = "0.2.2"
description = "Open-source Google Ads MCP server with audits, multi-currency reporting, and safety guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Fidel"}
]
keywords = ["mcp", "google ads", "automation", "analytics", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "filelock>=3.12",
    "google-auth>=2.25.2",
    "google-auth-oauthlib>=1.2.1",
    "mcp[cli]>=1.12.0,<2",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/fidelp27/mcp-googleads"
Repository = "https://github.com/fidelp27/mcp-googleads"
Issues = "https://github.com/fidelp27/mcp-googleads/issues"
Documentation = "https://github.com/fidelp27/mcp-googleads#readme"
Changelog = "https://github.com/fidelp27/mcp-googleads/blob/main/CHANGELOG.md"

[project.optional-dependencies]
remote = [
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=42.0",
    "httpx>=0.27,<1",
    "starlette>=0.27,<1",
    "uvicorn>=0.31,<1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "setuptools>=61.0",
    "wheel",
]

[project.scripts]
google-ads-mcp-server = "google_ads_cli:main"
google-ads-mcp = "google_ads_cli:main"
google-ads-mcp-connect = "google_ads_connect:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["google_ads_cli", "google_ads_server", "google_ads_connect"]

[tool.setuptools.packages.find]
include = ["agency*"]

[tool.setuptools.package-data]
agency = ["builtin_profiles/*.toml", "builtin_profiles/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
