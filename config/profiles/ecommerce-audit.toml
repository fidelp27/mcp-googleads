id = "ecommerce-audit"
name = "Ecommerce Performance Audit"
description = "Audit ecommerce Search, PMax, and Shopping accounts: ROAS vs target, budget constraints, wasted spend, and conversion value tracking."
version = "1.0"
recommended_modules = ["core", "measurement", "pmax", "shopping"]

[parameters]
days = 30
complete_days_only = true
target_roas = 4.0
min_waste_spend = 15.0
campaign_name_contains = ""
exclude_campaign_names = []

[thresholds]
max_daily_spend_micros = 250000000
min_ctr = 0.015
max_ctr_drop_pct = 25
max_cpa_micros = 40000000
max_waste_micros = 15000000
