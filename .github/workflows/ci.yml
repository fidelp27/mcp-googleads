name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,remote]"

      - name: Run pytest suite
        run: python -m pytest -q

      - name: Smoke test CLI demo registration
        run: google-ads-mcp-server register --client generic --demo

  package-and-docker:
    name: Wheel & Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel --no-deps . -w dist/

      - name: Build Docker image
        run: docker build -t google-ads-mcp-server:ci .

  privacy-guard:
    name: Hygiene & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden tracked files and secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(output|data|tmp|generated)/|(^|/)\.env$|client_secret\.json$|google_ads_token\.json$'; then
            echo "ERROR: Forbidden runtime or secret file tracked in Git."
            exit 1
          fi
          if git grep -n -E 'BEGIN (RSA |EC )?PRIVATE KEY|ya29\.[0-9A-Za-z_-]{20,}|1//0[0-9A-Za-z_-]{20,}' -- ':!tests/*' ':!.github/*'; then
            echo "ERROR: Potential credential or OAuth token detected in tracked files."
            exit 1
          fi
